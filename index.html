<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyiv Tiles</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }

        #game { display: flex; height: 100vh; }
        .panel { flex: 1; position: relative; }
        #satellite, #guessmap { position: absolute; inset: 0; }
        .divider { width: 3px; background: #d0d0d0; }
    </style>
</head>
<body>
    <div id="game">
        <div id="hud" style="position:fixed;bottom:0;left:0;right:0;z-index:1000;
            background:rgba(255,255,255,.96);border-top:1px solid #ddd;
            padding:10px 16px;display:flex;align-items:center;gap:16px;
            font:14px system-ui,sans-serif;">
            <span id="status">Завантаження точок...</span>
            <button id="btn" disabled style="margin-left:auto;padding:8px 18px;font-size:14px;
                border:none;border-radius:8px;background:#2c7fb8;color:#fff;cursor:pointer;">
                Перевірити
            </button>
            <span id="score">Рахунок: 0</span>
        </div>
        <div class="panel">
            <div id="satellite"></div>
        </div>
        <div class="divider"></div>
        <div class="panel">
            <div id="guessmap"></div>
        </div>
    </div>

    <script>
    // === супутниковий знімок ===
    const satMap = L.map('satellite', {
        zoomControl: false, attributionControl: false,
        dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
        boxZoom: false, keyboard: false, touchZoom: false
    }).setView([50.45, 30.52], 18);

    L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { maxZoom: 19 }
    ).addTo(satMap);

    // === OSM ===
    const guessMap = L.map('guessmap').setView([50.45, 30.52], 11);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap', maxZoom: 19
    }).addTo(guessMap);

    // === csv ===
    let goodPoints = [];

    function randomPointInKyiv() {
        const randomIndex = Math.floor(Math.random() * goodPoints.length);
        return goodPoints[randomIndex];
    }

    // === маркери ===
    const guessIcon = L.divIcon({
        className: '',
        html: '<div style="width:18px;height:18px;border-radius:50%;' +
              'background:#2c7fb8;border:3px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.5);"></div>',
        iconSize: [18, 18], iconAnchor: [9, 9]
    });
    const answerIcon = L.divIcon({
        className: '',
        html: '<div style="width:18px;height:18px;border-radius:50%;' +
              'background:#e6261f;border:3px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.5);"></div>',
        iconSize: [18, 18], iconAnchor: [9, 9]
    });

    const HIT_RADIUS = 150; // метрів — радіус "влучання"
    const TOTAL_ROUNDS = 5;

    let round = 0, score = 0;
    let answer = null, guess = null;
    let guessMarker = null, answerMarker = null, line = null;
    let phase = 'guessing'; // 'guessing' | 'revealed' | 'gameover'

    const statusEl = document.getElementById('status');
    const scoreEl  = document.getElementById('score');
    const btn      = document.getElementById('btn');

    function startRound() {
        // очистити попередні маркери
        [guessMarker, answerMarker, line].forEach(l => l && guessMap.removeLayer(l));
        guessMarker = answerMarker = line = guess = null;
        phase = 'guessing';

        const [lat, lng] = randomPointInKyiv();
        answer = [lat, lng];
        satMap.setView([lat, lng], 18);

        round++;
        statusEl.textContent = `Раунд ${round} / ${TOTAL_ROUNDS} — клікніть на карті, де це місце`;
        btn.textContent = 'Перевірити';
        btn.disabled = true; // блокуємо кнопку, поки гравець не клікне на карту
    }

    // Клік
    guessMap.on('click', e => {
        if (phase !== 'guessing') return;
        guess = [e.latlng.lat, e.latlng.lng];
        if (guessMarker) guessMap.removeLayer(guessMarker);
        guessMarker = L.marker(guess, { icon: guessIcon }).addTo(guessMap);
        btn.disabled = false;
    });

    // (Перевірити / Далі / Грати знову)
    btn.addEventListener('click', () => {
        if (phase === 'guessing') {
            if (!guess) return;
            const aLL = L.latLng(answer[0], answer[1]);
            const gLL = L.latLng(guess[0], guess[1]);
            const dist = Math.round(aLL.distanceTo(gLL)); // відстань у метрах

            answerMarker = L.marker(answer, { icon: answerIcon }).addTo(guessMap);
            line = L.polyline([guess, answer], { color: '#555', weight: 2, dashArray: '5,6' }).addTo(guessMap);
            guessMap.fitBounds(L.latLngBounds([guess, answer]).pad(0.5));

            const hit = dist <= HIT_RADIUS;
            if (hit) score++;
            scoreEl.textContent = `Рахунок: ${score}`;
            statusEl.textContent = hit
                ? `✅ ${dist} м до центру`
                : `❌ — ${dist} м до правильного місця`;

            phase = 'revealed';
            btn.textContent = round >= TOTAL_ROUNDS ? 'Підсумок' : 'Наступний раунд';
            btn.disabled = false;
        } else if (phase === 'revealed') {
            if (round >= TOTAL_ROUNDS) {
                statusEl.textContent = `Результат: ${score} / ${TOTAL_ROUNDS}`;
                btn.textContent = 'Грати знову';
                btn.disabled = false;
                phase = 'gameover';
            } else {
                startRound();
            }
        } else if (phase === 'gameover') {
            round = 0; score = 0;
            scoreEl.textContent = 'Рахунок: 0';
            startRound();
        }
    });

    // === точки з CSV ===
    fetch('points.csv')
        .then(r => r.text())
        .then(text => {
            goodPoints = text.trim().split('\n').map(line => {
                const parts = line.split(',');
                return [parseFloat(parts[0]), parseFloat(parts[1])];
            }).filter(pt => !isNaN(pt[0]) && !isNaN(pt[1]));

            console.log(`Завантажено ${goodPoints.length} точок!`);
            startRound(); // Запускаємо гру після того, як файлик прочитався
        })
        .catch(err => {
            console.error('Помилка завантаження points.csv:', err);
            statusEl.textContent = 'Помилка завантаження файлу точок (points.csv)';
        });
    </script>
</body>
</html>
