\<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyiv Tiles</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }

        #game { display: flex; height: 100vh; }
        .panel { flex: 1; position: relative; }
        .panel h2 {
            position: absolute; top: 0; left: 0; right: 0; z-index: 500;
            margin: 0; padding: 8px 12px; font-size: 14px;
            background: rgba(255,255,255,.9); color: #1f2937;
            border-bottom: 1px solid #e2e2e2;
        }
        #satellite, #guessmap { position: absolute; inset: 0; }

        .divider { width: 3px; background: #d0d0d0; }
    </style>
</head>
<body>
    <div id="game">
        <div class="panel">
            <div id="satellite"></div>
        </div>
        <div class="divider"></div>
        <div class="panel">
            <h2>Виберіть місце на мапі</h2>
            <div id="guessmap"></div>
        </div>
    </div>

    <script>
        // === супутниковий знімок ===
        const satMap = L.map('satellite', {
            zoomControl: false, attributionControl: false,
            dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
            boxZoom: false, keyboard: false, touchZoom: false
        }).setView([50.45, 30.52], 17);

        L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            { maxZoom: 19 }
        ).addTo(satMap);

        // === OSM ===
        const guessMap = L.map('guessmap').setView([50.45, 30.52], 10);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap', maxZoom: 19
        }).addTo(guessMap);

        // === межі Києва ===
        let kyivPolygon = null;
        fetch('kyiv.geojson')
            .then(r => r.json())
            .then(data => {
                kyivPolygon = data;
                const layer = L.geoJSON(data, {
                    style: { color: '#2c7fb8', weight: 2, fill: false }
                }).addTo(guessMap);
                guessMap.fitBounds(layer.getBounds());   // підлаштувати карту під Київ
                console.log('Межі Києва завантажено');
            })
            .catch(() => console.log('kyiv.geojson не знайдено'));
    </script>
</body>
</html>
