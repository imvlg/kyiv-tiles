<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyiv Tiles</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { margin: 0; padding: 0; background: #111827; color: #f3f4f6; overflow: hidden; }

        #game { display: flex; height: 100vh; position: relative; }
        .panel { flex: 1; position: relative; }
        #satellite, #guessmap { position: absolute; inset: 0; }
        .divider { width: 4px; background: #374151; z-index: 400; }

        /* Приціл у центрі супутникової карти */
        #satellite::after {
            content: '+';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 28px;
            font-weight: 300;
            pointer-events: none;
            z-index: 500;
        }

        /* HUD */
        #hud {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px; border-radius: 16px; display: flex; align-items: center;
            gap: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); min-width: 320px;
        }
        .status-text { font-size: 15px; font-weight: 500; }
        .score-badge { background: #3b82f6; padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 14px; }
        
        .btn-primary {
            padding: 10px 20px; font-size: 14px; font-weight: 600; border: none;
            border-radius: 10px; background: #2563eb; color: #fff; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary:hover:not(:disabled) { background: #1d4ed8; transform: translateY(-1px); }
        .btn-primary:disabled { background: #4b5563; cursor: not-allowed; opacity: 0.6; }

        /* (Меню / Фінал / Статистика) */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 2000; background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center;
        }

        /* Напівпрозорий фон для фінального вікна */
        .modal-overlay.end-overlay {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: none;
            pointer-events: none;
        }

        .modal {
            background: #1f2937; border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 32px; border-radius: 24px; width: 90%; max-width: 440px; text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }
        .modal h1 { margin-top: 0; font-size: 24px; color: #fff; }
        .modal p { color: #9ca3af; font-size: 14px; line-height: 1.5; }
        
        .form-group { margin: 20px 0; text-align: left; }
        .form-group label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 6px; }
        .form-group select {
            width: 100%; padding: 10px; border-radius: 8px; background: #374151;
            border: 1px solid #4b5563; color: #fff; font-size: 14px; outline: none;
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        .stat-card { background: #374151; padding: 12px; border-radius: 12px; text-align: center; }
        .stat-value { font-size: 20px; font-weight: 700; color: #60a5fa; }
        .stat-label { font-size: 11px; color: #9ca3af; text-transform: uppercase; margin-top: 4px; }
    </style>
</head>
<body>

    <!-- Стартове вікно -->
    <div id="start-modal" class="modal-overlay">
        <div class="modal">
            <h1>Kyiv Tiles</h1>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div id="stat-games" class="stat-value">0</div>
                    <div class="stat-label">Зіграно ігор</div>
                </div>
                <div class="stat-card">
                    <div id="stat-best" class="stat-value">0</div>
                    <div class="stat-label">Рекорд</div>
                </div>
            </div>

            <div class="form-group">
                <label for="rounds-select">Кількість раундів у грі:</label>
                <select id="rounds-select">
                    <option value="5" selected>5 раундів</option>
                    <option value="10">10 раундів</option>
                    <option value="15">15 раундів</option>
                </select>
            </div>

            <button id="start-btn" class="btn-primary" style="width: 100%; padding: 12px;" disabled>Завантаження точок...</button>
        </div>
    </div>

    <!-- Фінальне вікно -->
    <div id="end-modal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <h1 id="end-title">Гра завершена</h1>
            <p id="end-rank" style="font-weight: 600; color: #60a5fa; font-size: 16px; margin-bottom: 8px;"></p>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div id="end-score" class="stat-value">0/5</div>
                    <div class="stat-label">Ваш результат</div>
                </div>
                <div class="stat-card">
                    <div id="end-accuracy" class="stat-value">0%</div>
                    <div class="stat-label">Точність</div>
                </div>
            </div>

            <button id="restart-btn" class="btn-primary" style="width: 100%; padding: 12px;">Зіграти ще раз</button>
        </div>
    </div>

    <!-- Основна гра -->
    <div id="game">
        <div id="hud">
            <span id="status" class="status-text">Раунд 1</span>
            <span id="score" class="score-badge">0</span>
            <button id="btn" class="btn-primary" disabled style="margin-left: auto;">Перевірити</button>
        </div>

        <div class="panel"><div id="satellite"></div></div>
        <div class="divider"></div>
        <div class="panel"><div id="guessmap"></div></div>
    </div>

    <script>
    // === карти ===
    const satMap = L.map('satellite', {
        zoomControl: false, attributionControl: false, dragging: false,
        scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false
    }).setView([50.45, 30.52], 18);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(satMap);

    const guessMap = L.map('guessmap').setView([50.45, 30.52], 11);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(guessMap);

    // === СТАТИСТИКА (localStorage) ===
    function getStats() {
        return JSON.parse(localStorage.getItem('kyivTiles_stats')) || { gamesPlayed: 0, bestScore: 0 };
    }

    function saveStats(score, totalRounds) {
        const stats = getStats();
        stats.gamesPlayed++;
        if (score > stats.bestScore) stats.bestScore = score;
        localStorage.setItem('kyivTiles_stats', JSON.stringify(stats));
        updateStatsUI();
    }

    function updateStatsUI() {
        const stats = getStats();
        document.getElementById('stat-games').textContent = stats.gamesPlayed;
        document.getElementById('stat-best').textContent = stats.bestScore;
    }
    updateStatsUI();

    // === ЛОГІКА ГРИ ===
    let goodPoints = [];
    let totalRounds = 5;
    let round = 0, score = 0;
    let answer = null, guess = null;
    let guessMarker = null, answerMarker = null, line = null;
    let phase = 'guessing';

    // Історія та шари для фінальної карти
    let gameHistory = [];
    let summaryLayers = [];

    const guessIcon = L.divIcon({ 
        className: '',
        html: '<div style="width:16px;height:16px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.5);"></div>', 
        iconSize: [16, 16], iconAnchor: [8, 8] 
    });
    const answerIcon = L.divIcon({ 
        className: '',
        html: '<div style="width:16px;height:16px;border-radius:50%;background:#ef4444;border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.5);"></div>', 
        iconSize: [16, 16], iconAnchor: [8, 8] 
    });

    // Збільшено радіус влучання до 250м (покриває практично весь видимий кадр супутника)
    const HIT_RADIUS = 250; 

    const statusEl = document.getElementById('status');
    const scoreEl = document.getElementById('score');
    const btn = document.getElementById('btn');

    // Завантаження точок
    fetch('points.csv')
        .then(r => r.text())
        .then(text => {
            goodPoints = text.trim().split('\n').map(line => {
                const parts = line.split(',');
                return [parseFloat(parts[0]), parseFloat(parts[1])];
            }).filter(pt => !isNaN(pt[0]) && !isNaN(pt[1]));

            const startBtn = document.getElementById('start-btn');
            startBtn.textContent = 'Почати гру';
            startBtn.disabled = false;
        });

    function clearSummaryLayers() {
        summaryLayers.forEach(l => guessMap.removeLayer(l));
        summaryLayers = [];
    }

    // Початок нової гри
    document.getElementById('start-btn').addEventListener('click', () => {
        totalRounds = parseInt(document.getElementById('rounds-select').value);
        document.getElementById('start-modal').style.display = 'none';
        round = 0; score = 0; gameHistory = [];
        clearSummaryLayers();
        scoreEl.textContent = `0 / ${totalRounds}`;
        startRound();
    });

    // Рестарт
    document.getElementById('restart-btn').addEventListener('click', () => {
        const endModal = document.getElementById('end-modal');
        endModal.style.display = 'none';
        endModal.classList.remove('end-overlay');
        document.getElementById('start-modal').style.display = 'flex';
    });

    function startRound() {
        [guessMarker, answerMarker, line].forEach(l => l && guessMap.removeLayer(l));
        guessMarker = answerMarker = line = guess = null;
        phase = 'guessing';

        const randomIndex = Math.floor(Math.random() * goodPoints.length);
        answer = goodPoints[randomIndex];
        satMap.setView(answer, 18);

        round++;
        statusEl.textContent = `Раунд ${round} з ${totalRounds}`;
        btn.textContent = 'Перевірити';
        btn.disabled = true;
    }

    guessMap.on('click', e => {
        if (phase !== 'guessing') return;
        guess = [e.latlng.lat, e.latlng.lng];
        if (guessMarker) guessMap.removeLayer(guessMarker);
        guessMarker = L.marker(guess, { icon: guessIcon }).addTo(guessMap);
        btn.disabled = false;
    });

    btn.addEventListener('click', () => {
        if (phase === 'guessing') {
            if (!guess) return;
            const dist = Math.round(L.latLng(answer).distanceTo(L.latLng(guess)));
            const hit = dist <= HIT_RADIUS;

            gameHistory.push({ roundNum: round, answer, guess, dist, hit });

            answerMarker = L.marker(answer, { icon: answerIcon }).addTo(guessMap);
            line = L.polyline([guess, answer], { color: '#9ca3af', weight: 2, dashArray: '6,6' }).addTo(guessMap);
            guessMap.fitBounds(L.latLngBounds([guess, answer]).pad(0.4));

            if (hit) score++;

            scoreEl.textContent = `${score} / ${totalRounds}`;
            statusEl.textContent = hit ? `✅ (${dist} м)` : `❌ : ${dist} м`;

            phase = 'revealed';
            btn.textContent = round >= totalRounds ? 'Завершити' : 'Наступний раунд';
        } else if (phase === 'revealed') {
            if (round >= totalRounds) {
                showEndGameModal();
            } else {
                startRound();
            }
        }
    });

    function showEndGameModal() {
        saveStats(score, totalRounds);
        [guessMarker, answerMarker, line].forEach(l => l && guessMap.removeLayer(l));

        const allCoords = [];

        // Карта з номерами
        gameHistory.forEach(h => {
            const gIcon = L.divIcon({
                className: '',
                html: `<div style="width:22px;height:22px;border-radius:50%;background:#3b82f6;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.4);">${h.roundNum}</div>`,
                iconSize: [22, 22], iconAnchor: [11, 11]
            });

            const aIcon = L.divIcon({
                className: '',
                html: `<div style="width:22px;height:22px;border-radius:50%;background:#ef4444;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.4);">${h.roundNum}</div>`,
                iconSize: [22, 22], iconAnchor: [11, 11]
            });

            const mG = L.marker(h.guess, { icon: gIcon }).addTo(guessMap);
            const mA = L.marker(h.answer, { icon: aIcon }).addTo(guessMap);

            const l = L.polyline([h.guess, h.answer], {
                color: h.hit ? '#10b981' : '#f97316',
                weight: 3,
                dashArray: '6,6'
            }).addTo(guessMap);

            summaryLayers.push(mG, mA, l);
            allCoords.push(h.guess, h.answer);
        });

        if (allCoords.length > 0) {
            guessMap.fitBounds(L.latLngBounds(allCoords).pad(0.2));
        }

        // Розрахунок точності у відсотках
        const percentage = Math.round((score / totalRounds) * 100);

        let rank = "Турист";
        if (percentage >= 80) rank = "Мешканець лівого берега";
        else if (percentage >= 50) rank = "Працівник уклону";
        else if (percentage >= 30) rank = "Віталій Кличко";

        document.getElementById('end-score').textContent = `${score} / ${totalRounds}`;
        document.getElementById('end-accuracy').textContent = `${percentage}%`;
        document.getElementById('end-rank').textContent = rank;

        const endModal = document.getElementById('end-modal');
        endModal.classList.add('end-overlay');
        endModal.style.display = 'flex';
    }
    </script>
</body>
</html>
